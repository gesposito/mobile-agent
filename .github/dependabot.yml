# Dependabot proposes each new version as a pull request, after a cooldown of
# 7 days, so that a release pulled within a week of its publication never
# arrives (docs/research/open-sourcing.md); security updates come at once.
# Its jobs do not count against the Actions minutes. A Cargo update moves
# Cargo.lock alone: fetch its crates through Socket Firewall (`sfw cargo
# fetch`) before building it locally, as every install here goes.
version: 2
updates:
  # The toolchain rust-toolchain.toml pins (docs/research/toolchain.md).
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      # Stable Rust ships on a Thursday every six weeks.
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(toolchain)
  # The actions the workflows pin to a commit, the version in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  # The crates of the workspace's Cargo.lock and of the Android agent's host tests.
  - package-ecosystem: cargo
    directories:
      - /
      - /agent-android/host-tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
