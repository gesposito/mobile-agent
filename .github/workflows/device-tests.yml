name: Device tests

# The workspace's tests with the device-backed ones among them, on a fresh
# Simulator on the macOS runner and a fresh emulator on the Linux runner, run
# on a schedule or on demand and never on a push or a pull request (design D1
# of the pass-4-fixes change): ci.yml runs the tests on the fakes, where the
# device tests skip, and these runs are no merge gate. Each job provisions its
# device as benchmarks.yml's harness job for it does, with both fixtures of its
# platform, sets the variable that gates the device tests, runs
# `cargo test --workspace --no-fail-fast`, writes the tests' counts per crate
# to its summary and tears the device down whatever happened.

on:
  schedule:
    # Wednesdays at 03:23 UTC, off the start of the hour, when GitHub delays or
    # drops scheduled runs (docs/research/ci-benchmarks.md), and three days
    # from benchmarks.yml's Sunday run.
    - cron: "23 3 * * 3"
  workflow_dispatch:

# No permission unless a job asks for one; each job reads the repository's
# contents (docs/research/open-sourcing.md).
permissions: {}

concurrency:
  # One run at a time; a second one waits instead of cancelling it.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # DEBUG (task 1.2 of pass-4-fixes): evidence for the runtime lookup, the Expo fixture on
  # iOS 27.0 and the gRPC screenshot under swiftshader. Not for merging.
  simulator:
    name: iOS Simulator (debug)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SKIP_AGENT_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtimes and device types
        run: |
          mkdir -p "$RUNNER_TEMP/debug"
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/debug/runtimes.json"
          jq -r '.runtimes[] | select(.platform == "iOS") | "\(.identifier) available=\(.isAvailable) \(.availabilityError // "") iPhones: \([.supportedDeviceTypes[]?.name | select(startswith("iPhone"))] | join(", "))"' "$RUNNER_TEMP/debug/runtimes.json"
          xcrun simctl list devicetypes -j > "$RUNNER_TEMP/debug/devicetypes.json"
          jq '.devicetypes[] | select(.name == "iPhone 17")' "$RUNNER_TEMP/debug/devicetypes.json"
          if probe=$(xcrun simctl create probe-27-1 "iPhone 17" com.apple.CoreSimulator.SimRuntime.iOS-27-1 2>&1); then
            echo "created on 27.1: $probe"; xcrun simctl delete "$probe"
          else
            echo "create of an iPhone 17 on 27.1 failed: $probe"
          fi
      - name: Install Bun for the Expo fixture
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install Socket Firewall
        env:
          SFW_VERSION: "1.15.4"
          SFW_SHA256: 1b705ea7c399727ee41aa93f63e0469d2c3787c50e1dd8842cb8ff5ceec9eb99
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$HOME/.local/bin/sfw" \
            "https://github.com/SocketDev/sfw-free/releases/download/v$SFW_VERSION/sfw-free-macos-arm64"
          echo "$SFW_SHA256  $HOME/.local/bin/sfw" | shasum -a 256 -c -
          chmod +x "$HOME/.local/bin/sfw"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the Expo fixture
        run: |
          expo=$(fixtures/expo/build.sh)
          echo "MOBILE_AGENT_EXPO_APP=$expo" >> "$GITHUB_ENV"
          plutil -p "$expo/Info.plist" | grep -E "MinimumOSVersion|DTPlatformVersion|DTSDKName|CFBundleExecutable|DTXcode"
      - name: The Expo fixture on each iOS runtime that has an iPhone
        run: |
          set -u
          out="$RUNNER_TEMP/debug"
          probe() {
            runtime=$1 label=$2
            type=$(jq -r --arg id "$runtime" '.runtimes[] | select(.identifier == $id) | [.supportedDeviceTypes[]?.name | select(startswith("iPhone 17"))] | first // empty' "$out/runtimes.json")
            if [ -z "$type" ]; then echo "$label: no iPhone 17 model"; return; fi
            echo "== $label on $type"
            udid=$(xcrun simctl create "debug-$label" "$type" "$runtime")
            xcrun simctl bootstatus "$udid" -b > /dev/null
            xcrun simctl install "$udid" "$MOBILE_AGENT_EXPO_APP"
            started=$(date -u +"%Y-%m-%d %H:%M:%S")
            xcrun simctl launch "$udid" dev.mobileagent.fixture.expo
            for wait in 2 3 5 10 20; do
              sleep "$wait"
              echo "-- after +$wait s:"
              xcrun simctl spawn "$udid" launchctl list | grep -i "fixture.expo" || echo "(no fixture process in launchctl)"
              xcrun simctl io "$udid" screenshot "$out/$label-after-$wait.png" > /dev/null 2>&1 || true
            done
            xcrun simctl spawn "$udid" log show --start "$started" --style compact \
              --predicate 'process == "FixtureExpo" OR eventMessage CONTAINS "dev.mobileagent.fixture.expo" OR eventMessage CONTAINS "FixtureExpo"' \
              > "$out/$label-log.txt" 2>&1 || true
            wc -l "$out/$label-log.txt"
            grep -iE "terminat|crash|exception|signal|abort|fatal|jetsam|exit" "$out/$label-log.txt" | head -60 || true
            cp -R "$HOME/Library/Developer/CoreSimulator/Devices/$udid/data/Library/Logs" "$out/$label-device-logs" 2>/dev/null || true
            xcrun simctl shutdown "$udid" || true
            xcrun simctl delete "$udid" || true
          }
          probe com.apple.CoreSimulator.SimRuntime.iOS-27-0 ios-27-0
          probe com.apple.CoreSimulator.SimRuntime.iOS-27-1 ios-27-1
          ls -la "$HOME/Library/Logs/DiagnosticReports" || true
          mkdir -p "$out/DiagnosticReports"
          find "$HOME/Library/Logs/DiagnosticReports" -name '*Fixture*' -exec cp {} "$out/DiagnosticReports/" \; || true
          for report in "$out"/DiagnosticReports/*; do [ -f "$report" ] && head -c 6000 "$report"; done || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: debug-simulator
          path: ${{ runner.temp }}/debug
          retention-days: 7

  emulator:
    name: Android emulator (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      MOBILE_AGENT_ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let the runner's user open /dev/kvm for the emulator's acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Install the Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" platform-tools emulator
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build the screenshot test
        run: |
          mkdir -p "$RUNNER_TEMP/debug"
          cargo test -p android --test emulator_controller --no-run
      - name: The screenshot test on an API 36 emulator with swiftshader
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_8
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -grpc 8554 -grpc-use-token
          disable-animations: false
          script: |
            adb -s emulator-5554 exec-out screencap -p > "$RUNNER_TEMP/debug/screencap-before.png"
            bash -c 'MOBILE_AGENT_DEBUG_DUMP="$RUNNER_TEMP/debug" cargo test -p android --test emulator_controller raw_screenshots_are_full_resolution_and_top_down -- --nocapture || true'
            adb -s emulator-5554 exec-out screencap -p > "$RUNNER_TEMP/debug/screencap-after.png"
            adb -s emulator-5554 emu screenrecord screenshot "$RUNNER_TEMP/debug" || true
            bash -c 'adb -s emulator-5554 shell getprop | grep -iE "gpu|egl|render|hwui|opengl" > "$RUNNER_TEMP/debug/getprop.txt" || true'
            bash -c 'adb -s emulator-5554 shell dumpsys SurfaceFlinger | head -80 > "$RUNNER_TEMP/debug/surfaceflinger.txt" || true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: debug-emulator
          path: ${{ runner.temp }}/debug
          retention-days: 7
