name: Device tests

# The workspace's tests with the device-backed ones among them, on a fresh
# Simulator on the macOS runner and a fresh emulator on the Linux runner, run
# on a schedule or on demand and never on a push or a pull request (design D1
# of the pass-4-fixes change): ci.yml runs the tests on the fakes, where the
# device tests skip, and these runs are no merge gate. Each job provisions its
# device as benchmarks.yml's harness job for it does, with both fixtures of its
# platform, sets the variable that gates the device tests, runs
# `cargo test --workspace --no-fail-fast`, writes the tests' counts per crate
# to its summary and tears the device down whatever happened.

on:
  schedule:
    # Wednesdays at 03:23 UTC, off the start of the hour, when GitHub delays or
    # drops scheduled runs (docs/research/ci-benchmarks.md), and three days
    # from benchmarks.yml's Sunday run.
    - cron: "23 3 * * 3"
  workflow_dispatch:

# No permission unless a job asks for one; each job reads the repository's
# contents (docs/research/open-sourcing.md).
permissions: {}

concurrency:
  # One run at a time; a second one waits instead of cancelling it.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  simulator:
    name: iOS Simulator (SwiftUI and Expo)
    # As benchmarks.yml's harness-simulator: the Simulator driver types keys and text
    # through dtuhidd, which needs Xcode 27's CoreSimulator (crates/simulator/README.md,
    # Compatibility); Xcode 27 ships only on the xcode-27 preview image
    # (actions/runner-images#14404), with the iOS 27.0 runtime. The image's default
    # Xcode is kept.
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # No Android target here.
      SKIP_AGENT_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        # Its targets include the iOS Simulator's, for the Simulator driver's tree reader.
        run: rustup toolchain install --no-self-update
      - name: Install libjpeg-turbo for the Simulator driver's frame encoder
        # crates/simulator links libturbojpeg statically from Homebrew; see .cargo/config.toml.
        # TODO: Socket Firewall does not wrap Homebrew.
        run: brew install jpeg-turbo
      - name: Install Bun for the Expo fixture
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install Socket Firewall
        # The Expo fixture's build installs its packages through it. As benchmarks.yml's
        # harness-simulator does: the release asset directly, at a pinned release with its
        # SHA-256, since the npm launcher's GitHub API lookups are rate limited on shared runners.
        env:
          SFW_VERSION: "1.15.4"
          SFW_SHA256: 1b705ea7c399727ee41aa93f63e0469d2c3787c50e1dd8842cb8ff5ceec9eb99
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$HOME/.local/bin/sfw" \
            "https://github.com/SocketDev/sfw-free/releases/download/v$SFW_VERSION/sfw-free-macos-arm64"
          echo "$SFW_SHA256  $HOME/.local/bin/sfw" | shasum -a 256 -c -
          chmod +x "$HOME/.local/bin/sfw"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the SwiftUI and Expo fixtures
        # Their paths are also where the tests that boot a Simulator of their own install them from.
        run: |
          xcodebuild -version
          swiftui=$(fixtures/swiftui/build.sh)
          expo=$(fixtures/expo/build.sh)
          {
            echo "MOBILE_AGENT_SWIFTUI_APP=$swiftui"
            echo "MOBILE_AGENT_EXPO_APP=$expo"
          } >> "$GITHUB_ENV"
      - name: Boot a Simulator, install the fixtures and open the Expo fixture
        # As benchmarks.yml's harness-simulator boots its Simulator, with the Expo fixture installed
        # beside the SwiftUI one and launched on its Login tab, where the Simulator driver's tests
        # start (crates/simulator/README.md, Tests). Its UDID is the variable that gates the
        # Simulator tests. MOBILE_AGENT_SIM_FRESH_UDID stays unset: each test binary that needs a
        # device on its first boot creates one with the fixtures above and deletes it when it exits.
        run: |
          udid=$(xcrun simctl create mobile-agent-device-tests "iPhone 17")
          echo "MOBILE_AGENT_SIM_UDID=$udid" >> "$GITHUB_ENV"
          MOBILE_AGENT_SIM_UDID=$udid
          xcrun simctl bootstatus "$MOBILE_AGENT_SIM_UDID" -b
          xcrun simctl install "$MOBILE_AGENT_SIM_UDID" "$MOBILE_AGENT_SWIFTUI_APP"
          xcrun simctl install "$MOBILE_AGENT_SIM_UDID" "$MOBILE_AGENT_EXPO_APP"
          xcrun simctl launch "$MOBILE_AGENT_SIM_UDID" dev.mobileagent.fixture.expo
          xcrun simctl list devices "$MOBILE_AGENT_SIM_UDID"
      - name: Run the workspace's tests, the Simulator's among them
        # The build's messages name each test binary's package for the summary.
        run: |
          set -o pipefail
          cargo test --workspace --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/test-binaries.json"
          cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Write the summary
        if: always()
        run: |
          {
            echo "## Device tests: iOS Simulator"
            echo
            if [ -f "$RUNNER_TEMP/tests.log" ]; then
              scripts/test-summary.sh "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/test-binaries.json"
            else
              echo "The tests did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the Simulator
        if: always() && env.MOBILE_AGENT_SIM_UDID != ''
        run: |
          xcrun simctl shutdown "$MOBILE_AGENT_SIM_UDID" || true
          xcrun simctl delete "$MOBILE_AGENT_SIM_UDID"

  emulator:
    name: Android emulator (Compose and Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # The image's Android SDK, as in ci.yml.
      ANDROID_HOME: /usr/local/lib/android/sdk
      # The emulator the runner's step boots, the variable that gates the Android tests.
      MOBILE_AGENT_ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let the runner's user open /dev/kvm for the emulator's acceleration
        # As benchmarks.yml's harness-emulator does.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Install JDK 21 and Kotlin 2.4.20 for the Android agent and the fixtures
        # As in ci.yml and benchmarks.yml. TODO: Socket Firewall does not wrap mise.
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.7
          mise_toml: |
            [tools]
            java = "temurin-21"
            kotlin = { version = "2.4.20", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
      - name: Install the Android SDK packages
        # benchmarks.yml's harness-emulator's: the agent takes d8 and R8 from build-tools 37.0.0,
        # 36.0.0 is the Compose fixture's. The Expo fixture's beside them: build-tools 35.0.0 and the
        # NDK and CMake React Native compiles its C++ with (fixtures/expo/README.md, Build
        # (Android)). The emulator package before the build, so that the controller client is
        # generated from the proto of the emulator the tests run (crates/android/build.rs).
        # TODO: Socket Firewall does not wrap sdkmanager.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "build-tools;37.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1" platform-tools emulator
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Bun for the Expo fixture
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install Socket Firewall
        # The Expo fixture's build installs its packages through it; as benchmarks.yml's
        # harness-emulator installs it.
        env:
          SFW_VERSION: "1.15.4"
          SFW_SHA256: cf9f55b8343e1ef6e6dcccdb09b99c70c0430a22ed7d0079286eccddeaf72670
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$HOME/.local/bin/sfw" \
            "https://github.com/SocketDev/sfw-free/releases/download/v$SFW_VERSION/sfw-free-linux-x86_64"
          echo "$SFW_SHA256  $HOME/.local/bin/sfw" | sha256sum -c -
          chmod +x "$HOME/.local/bin/sfw"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the Android agent's jar, which the Android driver's tests deploy
        run: agent-android/build.sh
      - name: Build the Compose and Expo fixtures
        env:
          # The Expo fixture's native code for the emulator's ABI alone, instead of the four its
          # gradle.properties names; Gradle takes ORG_GRADLE_PROJECT_ variables over that file.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        run: |
          compose=$(fixtures/compose/build.sh)
          expo=$(PLATFORM=android fixtures/expo/build.sh)
          {
            echo "COMPOSE_APK=$compose"
            echo "EXPO_APK=$expo"
          } >> "$GITHUB_ENV"
      - name: Build the workspace's tests
        # Before the emulator boots. The build's messages name each test binary's package for
        # the summary.
        run: cargo test --workspace --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/test-binaries.json"
      - name: Run the workspace's tests on an API 36 emulator, the Android tests among them
        # As benchmarks.yml's harness-emulator boots its emulator, with the Expo fixture installed
        # beside the Compose one.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # Software rendering, and the gRPC controller on, which the emulator tests need.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -grpc 8554 -grpc-use-token
          disable-animations: false
          # Each line runs in a shell of its own, and the first that fails ends the script.
          script: |
            adb -s emulator-5554 install -r "$COMPOSE_APK"
            adb -s emulator-5554 install -r "$EXPO_APK"
            bash -c 'set -o pipefail; cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/tests.log"'
      - name: Write the summary
        if: always()
        run: |
          {
            echo "## Device tests: Android emulator"
            echo
            if [ -f "$RUNNER_TEMP/tests.log" ]; then
              scripts/test-summary.sh "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/test-binaries.json"
            else
              echo "The tests did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Shut the emulator down
        # The runner's step kills the emulator once its script ends, failed or not; this covers
        # a step cancelled at the job's timeout.
        if: always()
        run: |
          if "$ANDROID_HOME/platform-tools/adb" devices | grep -q '^emulator-5554[[:space:]]'; then
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill
          fi
