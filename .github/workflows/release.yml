name: Release

# The release of the three binaries, mobile-agent, mobile-agent-daemon and
# mobile-agent-mcp, on a dispatch naming the version (design D2 of the
# alpha-release change; docs/research/alpha-release.md). The Android agent's
# jar is built once, so that every target's daemon embeds the same one; each
# target's job builds the binaries for the version, packs them with the
# third-party notices and their SHA-256 sums into
# mobile-agent-<version>-<target>.tar.gz, writes the tarball's own SHA-256
# sum beside it, attests the tarball and the binaries with build provenance
# and keeps both as an artifact for 90 days; a job per target then downloads
# every tarball, verifies its attestation and its sum and runs its own
# target's binaries. A dry run, the default, stops there. Otherwise the gate
# job, in the release environment, waits for its reviewer's approval and
# ends the commit's deployment to release with success, which the tag
# ruleset requires before a v* tag is created; then the publish job, the one
# job that writes, creates the pre-release v<version> on the dispatched
# commit as a draft, with the changelog's section for the version as its
# notes, the tarballs, their sums and the notices, and publishes it, which
# creates the tag. It refuses a version other than the workspace's, which
# the daemon and the server print, and a changelog without the version's
# dated section (scripts/release-notes.sh), as the first job does before
# anything is built. The npm-package job, once every target is verified,
# verifies the tarballs again and packs the four npm packages from them
# (npm/pack.sh, design D7): one per target holding its binaries and
# @mobileagent/cli, the launcher whose optional dependencies they are. The
# publish-npm job publishes them after the release, in the release
# environment, with npm's trusted publishing and provenance and no npm
# token; a dry run publishes them with --dry-run, outside the environment.
# No job uses a cache.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version, a semantic version without the v, such as 0.1.0-alpha.1, or 0.0.0-dryrun for a rehearsal"
        type: string
        required: true
      dry_run:
        description: "Build, attest and verify the binaries without publishing them"
        type: boolean
        default: true

# No permission unless a job asks for one (docs/research/open-sourcing.md).
permissions: {}

concurrency:
  # One release at a time: a second dispatch waits, and none is cancelled halfway.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  jar:
    name: Android agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The image's Android SDK, as in ci.yml.
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check the version
        run: |
          if ! [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be a semantic version without the v, such as 0.1.0-alpha.1, not $VERSION"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check, when the run publishes, the workspace's version and the changelog's section
        # The publish job checks the same before it creates anything; here a refusal builds nothing.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != true ]; then
            scripts/release-notes.sh "$VERSION" > /dev/null
          fi
      - name: Install JDK 21 and Kotlin 2.4.20 for the Android agent
        # As in ci.yml's Linux job, without its cache. TODO: Socket Firewall does not wrap mise.
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.7
          cache: false
          mise_toml: |
            [tools]
            java = "temurin-21"
            kotlin = { version = "2.4.20", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
      - name: Check that the pinned JDK and Kotlin come first on PATH
        # build.sh takes the Kotlin behind kotlinc on PATH.
        run: |
          java -version 2>&1 | grep '"21\.'
          kotlinc -version 2>&1 | grep 'kotlinc-jvm 2\.4\.20 '
      - name: Install the Android SDK packages
        # The agent compiles against android-36 and takes d8 and R8 from the newest build-tools,
        # 37.0.0. TODO: Socket Firewall does not wrap sdkmanager.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;37.0.0"
      - name: Build the Android agent
        run: agent-android/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-android-jar
          path: agent-android/dist/mobile-agent-android.jar
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build ${{ matrix.target }}
    needs: jar
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The Mac with Xcode on the image of ci.yml's Xcode 27 job, whose Xcode builds the
        # Simulator reader; Linux on both architectures on the oldest Ubuntu GitHub hosts, for
        # hosts that drive Android alone, whose binaries need its glibc, 2.35, or newer.
        include:
          - { target: aarch64-apple-darwin, runner: xcode-27 }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    permissions:
      contents: read
      id-token: write # the OIDC token whose identity Sigstore certifies for the attestation
      attestations: write # to store the attestation in the repository
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Xcode the Simulator reader is built with
        if: runner.os == 'macOS'
        # The image's default, which ci.yml's Xcode 27 job keeps; the Simulator driver needs Xcode
        # 27's CoreSimulator (crates/simulator/README.md, Compatibility).
        run: |
          xcodebuild -version
          version=$(xcodebuild -version | sed -n '1s/^Xcode //p')
          if [ "${version%%.*}" != 27 ]; then
            echo "::error::the image's default Xcode is $version, not Xcode 27"
            exit 1
          fi
          {
            echo "## Xcode"
            echo
            echo '```'
            xcodebuild -version
            echo "iOS Simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install the Rust toolchain from rust-toolchain.toml
        # Its targets include the iOS Simulator's, for the Simulator driver's tree reader.
        run: rustup toolchain install --no-self-update
      - name: Install libjpeg-turbo for the Simulator driver's frame encoder
        if: runner.os == 'macOS'
        # crates/simulator links libturbojpeg statically from Homebrew; see .cargo/config.toml.
        # TODO: Socket Firewall does not wrap Homebrew.
        run: brew install jpeg-turbo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-android-jar
          path: ${{ runner.temp }}/jar
      - name: Build mobile-agent, its daemon and the MCP server
        env:
          # The version --version prints, beside the commit (crates/cli/build.rs).
          MOBILE_AGENT_RELEASE: ${{ inputs.version }}
          # The jar of the jar job, which every target's daemon embeds.
          MOBILE_AGENT_JAR: ${{ runner.temp }}/jar/mobile-agent-android.jar
          # The vendored emulator controller proto rather than whichever one the runner's SDK
          # ships, so that every target's daemon is built from the same (crates/android/build.rs).
          MOBILE_AGENT_EMULATOR_PROTO: ${{ github.workspace }}/crates/android/proto/emulator_controller.proto
        run: cargo build --release --locked --target "$TARGET" -p mobile-agent -p mobile-agent-daemon -p mobile-agent-mcp
      - name: Check the binaries
        # The Mac's daemon embeds the Simulator reader and links libjpeg-turbo statically, so it
        # needs nothing from Homebrew; the Linux binaries link the system's libc alone.
        run: |
          dir="target/$TARGET/release"
          file "$dir/mobile-agent" "$dir/mobile-agent-daemon" "$dir/mobile-agent-mcp"
          "$dir/mobile-agent" --version
          if [ "$RUNNER_OS" = macOS ]; then
            reader="$dir/simulator-reader-target/aarch64-apple-ios-sim/release/simulator-reader"
            test -x "$reader"
            otool -l "$reader" | grep -A 4 LC_BUILD_VERSION
            otool -L "$dir/mobile-agent-daemon"
            if otool -L "$dir/mobile-agent-daemon" | grep -q /opt/homebrew; then
              echo "::error::the daemon links a library from Homebrew"
              exit 1
            fi
          else
            ldd "$dir/mobile-agent-daemon"
          fi
      - name: Pack the binaries, the notices and their SHA-256 sums
        run: |
          name="mobile-agent-$VERSION-$TARGET"
          mkdir -p "$RUNNER_TEMP/dist/$name"
          cp "target/$TARGET/release/mobile-agent" "target/$TARGET/release/mobile-agent-daemon" \
            "target/$TARGET/release/mobile-agent-mcp" THIRD-PARTY-NOTICES.md "$RUNNER_TEMP/dist/$name/"
          cd "$RUNNER_TEMP/dist"
          (cd "$name" && shasum -a 256 mobile-agent mobile-agent-daemon mobile-agent-mcp THIRD-PARTY-NOTICES.md > SHA256SUMS)
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"
          {
            echo "## $name.tar.gz"
            echo
            echo "| File | Bytes |"
            echo "|---|---|"
            for file in "$name.tar.gz" "$name"/*; do
              echo "| $file | $(wc -c < "$file" | tr -d ' ') |"
            done
            echo
            echo '```'
            cat "$name.tar.gz.sha256" "$name/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the tarball and the binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/${{ env.NAME }}.tar.gz
            ${{ runner.temp }}/dist/${{ env.NAME }}/mobile-agent
            ${{ runner.temp }}/dist/${{ env.NAME }}/mobile-agent-daemon
            ${{ runner.temp }}/dist/${{ env.NAME }}/mobile-agent-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ runner.temp }}/dist/${{ env.NAME }}.tar.gz
            ${{ runner.temp }}/dist/${{ env.NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Verify ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The build job's targets, each on the runner that built it.
        include:
          - { target: aarch64-apple-darwin, runner: xcode-27 }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    permissions:
      contents: read
      attestations: read # gh attestation verify fetches them through the API
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mobile-agent-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Verify the attestations and the sums of every tarball and the attestations of this target's binaries
        # Signed by this workflow in this repository from the dispatched commit, on a
        # GitHub-hosted runner.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          ls -l
          verify() {
            gh attestation verify "$1" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          }
          tarballs=0
          for tarball in mobile-agent-*.tar.gz; do
            verify "$tarball"
            shasum -a 256 -c "$tarball.sha256"
            tarballs=$((tarballs + 1))
          done
          if [ "$tarballs" != 3 ]; then
            echo "::error::$tarballs tarballs downloaded, not 3"
            exit 1
          fi
          name="mobile-agent-$VERSION-$TARGET"
          tar -xzf "$name.tar.gz"
          for bin in mobile-agent mobile-agent-daemon mobile-agent-mcp; do
            verify "$name/$bin"
          done
      - name: Check the sums and run this target's binaries
        run: |
          cd "$RUNNER_TEMP/dist/mobile-agent-$VERSION-$TARGET"
          shasum -a 256 -c SHA256SUMS
          expected="mobile-agent $VERSION (${GITHUB_SHA:0:12})"
          printed=$(./mobile-agent --version)
          if [ "$printed" != "$expected" ]; then
            echo "::error::mobile-agent --version printed '$printed', not '$expected'"
            exit 1
          fi
          echo "$printed"
          ./mobile-agent-daemon --version
          ./mobile-agent-mcp --version

  gate:
    name: Release gate
    needs: [build, verify]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The environment's reviewer approves this job, from main alone; its success ends the commit's
    # deployment to release, which the tag ruleset requires before a v* tag is created. The publish
    # job is not in the environment: a tag created while its own deployment was in progress was
    # refused, "Missing successful active release deployment" (docs/maintaining.md, At the first
    # release).
    environment: release
    permissions:
      contents: read
    steps:
      - name: Deploy the commit to release
        run: echo "The release environment's reviewer approved v$VERSION on $GITHUB_SHA"

  publish:
    name: Publish
    needs: gate
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the release, and with it the tag
    env:
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workspace's version and take the changelog's section as the notes
        # The daemon and the server print the workspace's version, so the release has to be it.
        run: scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mobile-agent-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Check the tarballs and their sums, and that the version has no release or tag yet
        run: |
          cd "$RUNNER_TEMP/dist"
          ls -l
          tarballs=$(find . -maxdepth 1 -name 'mobile-agent-*.tar.gz' | wc -l)
          sums=$(find . -maxdepth 1 -name 'mobile-agent-*.tar.gz.sha256' | wc -l)
          if [ "$tarballs" != 3 ] || [ "$sums" != 3 ]; then
            echo "::error::$tarballs tarballs and $sums sums downloaded, not 3 of each"
            exit 1
          fi
          shasum -a 256 -c mobile-agent-*.tar.gz.sha256
          cd "$GITHUB_WORKSPACE"
          status=0
          git ls-remote --exit-code origin "refs/tags/$TAG" || status=$?
          if [ "$status" != 2 ]; then
            echo "::error::the tag $TAG exists already, or the remote did not answer (git ls-remote: $status)"
            exit 1
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::a release $TAG exists already, a draft perhaps, which this job does not reuse"
            exit 1
          fi
      - name: Create the draft pre-release with the tarballs, their sums and the notices
        run: |
          cd "$RUNNER_TEMP/dist"
          cp "$GITHUB_WORKSPACE/THIRD-PARTY-NOTICES.md" .
          gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" \
            --title "mobile-agent $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            mobile-agent-*.tar.gz mobile-agent-*.tar.gz.sha256 THIRD-PARTY-NOTICES.md
      - name: Publish the release, which creates the tag
        run: gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"
      - name: Check the tag and the release
        run: |
          tagged=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::the tag $TAG points at '$tagged', not at $GITHUB_SHA"
            exit 1
          fi
          # The three tarballs, their three sums and the notices.
          read -r draft prerelease assets url < <(gh release view "$TAG" -R "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url --jq '"\(.isDraft) \(.isPrerelease) \(.assets | length) \(.url)"')
          echo "$TAG: draft $draft, pre-release $prerelease, $assets assets, $url"
          if [ "$draft" != false ] || [ "$prerelease" != true ] || [ "$assets" != 7 ]; then
            echo "::error::the release $TAG is draft $draft and pre-release $prerelease with $assets assets"
            exit 1
          fi
          {
            echo "## $TAG"
            echo
            echo "[$TAG]($url) on $GITHUB_SHA, a pre-release."
          } >> "$GITHUB_STEP_SUMMARY"

  npm-package:
    name: npm packages
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify fetches them through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 24.22.1, whose npm is 11.19.1
        # npm's trusted publishing needs npm 11.5.1 or newer, which Ubuntu 24.04's default Node, 22,
        # lacks, and the packages are packed with the npm that publishes them. setup-node takes
        # 24.22.1 from the image's tool cache, or else from GitHub's actions/node-versions. No cache.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mobile-agent-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Verify the attestations and the sums of every tarball again
        # As the verify jobs do: signed by this workflow in this repository from the dispatched
        # commit, on a GitHub-hosted runner.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          ls -l
          tarballs=0
          for tarball in mobile-agent-*.tar.gz; do
            gh attestation verify "$tarball" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
            shasum -a 256 -c "$tarball.sha256"
            tarballs=$((tarballs + 1))
          done
          if [ "$tarballs" != 3 ]; then
            echo "::error::$tarballs tarballs downloaded, not 3"
            exit 1
          fi
      - name: Pack the four npm packages from the tarballs
        # npm/pack.sh builds nothing: each platform package holds its tarball's binaries and
        # notices, the launcher's optional dependencies name them at the version, and each package
        # has to list exactly its files in npm pack --dry-run.
        run: |
          npm --version
          npm/pack.sh "$VERSION" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/npm" > "$RUNNER_TEMP/npm-lists.txt"
          cat "$RUNNER_TEMP/npm-lists.txt" "$RUNNER_TEMP/npm/SHA256SUMS"
          {
            echo "## npm packages"
            echo
            echo '```'
            cat "$RUNNER_TEMP/npm-lists.txt"
            echo
            cat "$RUNNER_TEMP/npm/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: |
            ${{ runner.temp }}/npm/*.tgz
            ${{ runner.temp }}/npm/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish-npm:
    name: Publish to npm
    needs: [publish, npm-package]
    # After the release is published, so that npm never holds a version the release lacks; a dry
    # run, which has no gate and no release, publishes with --dry-run.
    if: ${{ !cancelled() && needs.npm-package.result == 'success' && (inputs.dry_run || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The release environment's reviewer approves a run that publishes, a second approval after the
    # gate's, from main alone, and each package's trusted publisher on npm names the environment, so
    # that no job outside it can publish; a dry run has no environment, no deployment and nothing to
    # approve.
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # the OIDC token npm's trusted publishing exchanges and the provenance is signed with
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Install Node 24.22.1, whose npm is 11.19.1
        # As in the npm-package job. No cache.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm
      - name: Publish the platform packages, then the launcher, with provenance
        # npm's trusted publishing exchanges the job's OIDC token for one that publishes these
        # packages alone, so the job has no npm token. npm 11 refuses a prerelease without a tag:
        # a prerelease goes under its first identifier, alpha for 0.1.0-alpha.2, and a release
        # under latest. A version npm holds already is skipped, so that a run that stopped halfway
        # can be run again.
        run: |
          cd "$RUNNER_TEMP/npm"
          ls -l
          shasum -a 256 -c SHA256SUMS
          npm=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $npm is older than 11.5.1, which npm's trusted publishing needs"
            exit 1
          fi
          case $VERSION in
            *-*) tag=${VERSION#*-} && tag=${tag%%.*} ;;
            *) tag=latest ;;
          esac
          flags=()
          if [ "$DRY_RUN" = true ]; then
            flags+=(--dry-run)
          fi
          for package in cli-darwin-arm64 cli-linux-x64 cli-linux-arm64 cli; do
            name="@mobileagent/$package"
            if [ "$(npm view "$name@$VERSION" version 2> /dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is on npm already: skipped"
              continue
            fi
            npm publish "./mobileagent-$package-$VERSION.tgz" --provenance --access public --tag "$tag" "${flags[@]}"
            echo "- \`$name@$VERSION\` under \`$tag\`${flags:+, a dry run}" >> "$GITHUB_STEP_SUMMARY"
          done
