[package]
name = "ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The runner speaks the device protocol (`protocol`).
[dependencies]
plist = "1.10.1"
protocol = { version = "0.1.0", path = "../protocol" }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
idevice = { version = "=0.1.68", features = ["usbmuxd", "core_device_proxy", "tunnel_tcp_stack", "rsd", "xpc", "mobile_image_mounter", "tss", "installation_proxy", "afc", "dvt", "xctest"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util", "process"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ns-keyed-archive = "0.1.5"
