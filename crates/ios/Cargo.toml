[package]
name = "mobile-agent-ios"
description = "mobile-agent's physical iPhone driver over USB: the device's services, input, screenshots as frames and an XCTest runner's tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

[lib]
name = "ios"

# The runner speaks the device protocol (`protocol`). `idevice`'s HID clients
# come with its `display_stream` feature, though they open no stream. Frames
# go through the Simulator pipeline's downscale, hashes and JPEG encoder
# (`simulator`, with its dependency-free encoder so the crate builds without
# libjpeg-turbo); the device's screenshots arrive as PNG (`png`).
[dependencies]
mobile-agent-protocol = { version = "0.1.0-alpha.1", path = "../protocol" }
mobile-agent-simulator = { version = "0.1.0-alpha.1", path = "../simulator", default-features = false, features = ["jpeg-encoder"] }
plist = "1.10.1"
png = "0.18.1"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
idevice = { version = "=0.1.68", features = ["usbmuxd", "core_device_proxy", "tunnel_tcp_stack", "rsd", "xpc", "mobile_image_mounter", "tss", "installation_proxy", "afc", "dvt", "xctest", "core_device", "display_stream"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util", "process"] }

# The device tests ask for the runner `agent-ios` builds, and list its trees
# through the mirror beside the Simulator reader's, which the Simulator
# driver records with its reader.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
mobile-agent-ios-runner = { version = "0.1.0-alpha.1", path = "../../agent-ios" }
mobile-agent-mirror = { version = "0.1.0-alpha.1", path = "../mirror" }
mobile-agent-simulator = { version = "0.1.0-alpha.1", path = "../simulator", default-features = false, features = ["jpeg-encoder", "reader"] }
ns-keyed-archive = "0.1.5"
