[package]
name = "cli"
description = "mobile-agent, the command line agents drive Android devices, emulators, iOS Simulators and iPhones with"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

# The library and the binary hold no benchmark; their libtest bench harnesses, which cargo bench runs first, would refuse criterion's flags such as --noplot.
[lib]
bench = false

[[bin]]
name = "mobile-agent"
path = "src/main.rs"
bench = false

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env", "suggestions"] }
serde_json = "1.0.151"
