[package]
name = "mirror"
description = "The live UI replica of one target: its windows, accessibility tree and latest frame, and the listings, waits and settle checks answered from them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

# The library holds no benchmark; its libtest bench harness, which cargo bench runs first, would refuse criterion's flags such as --noplot.
[lib]
bench = false

[dependencies]
protocol = { version = "0.1.0", path = "../protocol" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
serde_json = "1.0.151"

# The microbenchmarks of the replica, the listings, visibility, deltas, waits and settle (benches/mirror.rs), run by mobile-agent-bench micro; criterion's own harness is off.
[[bench]]
name = "mirror"
harness = false
