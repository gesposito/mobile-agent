[package]
name = "mobile-agent-bench"
description = "mobile-agent-bench: the benchmark harness against Maestro and agent-device, and the host microbenchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
# Not published to crates.io: the harness runs in a checkout of this
# repository, where it drives the fixture apps built from fixtures/, compares
# the microbenchmarks with reports/micro/baseline.json and, for --ab, builds
# another ref of the repository, none of which is in its package; no
# published crate depends on it.
publish = false

# The library and the binary hold no benchmark; their libtest bench harnesses, which cargo bench runs first, would refuse criterion's flags such as --noplot.
[lib]
name = "bench"
bench = false

[[bin]]
name = "mobile-agent-bench"
path = "src/main.rs"
bench = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
mobile-agent-wire = { version = "0.1.0-alpha.1", path = "../wire" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The WebDriverAgent baseline's helper starts WebDriverAgent on a physical
# iPhone through the test manager and bridges its port over usbmuxd, with
# `idevice`'s xctest session and WDA bridge, the version `crates/ios` pins.
[target.'cfg(target_os = "macos")'.dependencies]
idevice = { version = "=0.1.68", features = ["usbmuxd", "installation_proxy", "xctest", "wda"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[lints]
workspace = true
