[package]
name = "bench"
description = "mobile-agent-bench: the benchmark harness against Maestro and agent-device, and the host microbenchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

# The library and the binary hold no benchmark; their libtest bench harnesses, which cargo bench runs first, would refuse criterion's flags such as --noplot.
[lib]
bench = false

[[bin]]
name = "mobile-agent-bench"
path = "src/main.rs"
bench = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wire = { version = "0.1.0", path = "../wire" }

# The WebDriverAgent baseline's helper starts WebDriverAgent on a physical
# iPhone through the test manager and bridges its port over usbmuxd, with
# `idevice`'s xctest session and WDA bridge, the version `crates/ios` pins.
[target.'cfg(target_os = "macos")'.dependencies]
idevice = { version = "=0.1.68", features = ["usbmuxd", "installation_proxy", "xctest", "wda"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[lints]
workspace = true
