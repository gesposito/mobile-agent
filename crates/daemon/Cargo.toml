[package]
name = "daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mobile-agent-daemon"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
android = { version = "0.1.0", path = "../android" }
libc = "0.2"
mirror = { version = "0.1.0", path = "../mirror" }
protocol = { version = "0.1.0", path = "../protocol" }
serde_json = "1.0.151"
simulator = { version = "0.1.0", path = "../simulator" }

[build-dependencies]
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

# The microbenchmarks of the JSON wire and a snapshot through the socket of a daemon on a fake target (benches/daemon.rs), run by mobile-agent-bench micro; criterion's own harness is off.
[[bench]]
name = "daemon"
harness = false
