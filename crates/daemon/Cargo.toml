[package]
name = "mobile-agent-daemon"
description = "The mobile-agent daemon: one process that holds every device connection and a mirror per attached target, and answers the CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

# The library and the binary hold no benchmark; their libtest bench harnesses, which cargo bench runs first, would refuse criterion's flags such as --noplot.
[lib]
name = "daemon"
bench = false

[[bin]]
name = "mobile-agent-daemon"
path = "src/main.rs"
bench = false

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
libc = "0.2"
mobile-agent-android = { version = "0.1.0-alpha.1", path = "../android" }
mobile-agent-ios = { version = "0.1.0-alpha.1", path = "../ios" }
mobile-agent-ios-runner = { version = "0.1.0-alpha.1", path = "../../agent-ios" }
mobile-agent-mirror = { version = "0.1.0-alpha.1", path = "../mirror" }
mobile-agent-protocol = { version = "0.1.0-alpha.1", path = "../protocol" }
mobile-agent-simulator = { version = "0.1.0-alpha.1", path = "../simulator" }
mobile-agent-wire = { version = "0.1.0-alpha.1", path = "../wire" }
serde_json = "1.0.151"

[build-dependencies]
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

# The microbenchmarks of the JSON wire and a snapshot through the socket of a daemon on a fake target (benches/daemon.rs), run by mobile-agent-bench micro; criterion's own harness is off.
[[bench]]
name = "daemon"
harness = false
