[package]
name = "mobile-agent-mcp"
description = "mobile-agent-mcp, the Model Context Protocol server over the mobile-agent daemon: one tool per action an agent drives, in a session of its own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
publish.workspace = true

# The binary holds no benchmark; its libtest bench harness, which cargo bench runs first, would refuse criterion's flags such as --noplot.
[[bin]]
name = "mobile-agent-mcp"
path = "src/main.rs"
bench = false

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
mobile-agent = { version = "0.1.0-alpha.1", path = "../cli" }
mobile-agent-wire = { version = "0.1.0-alpha.1", path = "../wire", features = ["schema"] }
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-io"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "signal", "time"] }

[dev-dependencies]
base64 = "0.23.1"
criterion = { version = "0.8.2", default-features = false }
rmcp = { version = "=3.8.0", features = ["client"] }
tokio = { version = "1.53.1", features = ["rt", "process"] }

# The microbenchmark of a tools/call snapshot through the server over a daemon on a fake target (benches/mcp.rs), run by mobile-agent-bench micro; criterion's own harness is off.
[[bench]]
name = "mcp"
harness = false
