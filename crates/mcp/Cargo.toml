[package]
name = "mcp"
description = "mobile-agent-mcp, the Model Context Protocol server over the mobile-agent daemon: one tool per action an agent drives, in a session of its own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

[[bin]]
name = "mobile-agent-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cli = { version = "0.1.0", path = "../cli" }
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "signal"] }
wire = { version = "0.1.0", path = "../wire", features = ["schema"] }

[dev-dependencies]
base64 = "0.22.1"
rmcp = { version = "=3.5.1", features = ["client"] }
tokio = { version = "1.53.1", features = ["rt", "process"] }
