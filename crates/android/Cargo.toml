[package]
name = "android"
description = "mobile-agent's Android driver: the adb client, the agent's deploy and session, and the emulator's gRPC controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

# The library holds no benchmark; its libtest bench harness, which cargo bench runs first, would refuse criterion's flags such as --noplot.
[lib]
bench = false

[dependencies]
jpeg-encoder = "0.7.1"
mirror = { version = "0.1.0", path = "../mirror" }
prost = "0.14.4"
protocol = { version = "0.1.0", path = "../protocol" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.6"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
miniz_oxide = "0.9.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }

# The microbenchmarks of the emulator frame hash (benches/frames.rs), run by mobile-agent-bench micro; criterion's own harness is off.
[[bench]]
name = "frames"
harness = false
