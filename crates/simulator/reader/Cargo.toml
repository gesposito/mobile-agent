[package]
name = "simulator-reader"
description = "The accessibility tree reader the Simulator driver spawns inside an iOS Simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
protocol = { version = "0.1.0", path = "../../protocol" }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-foundation = "0.3.2"

# The library holds no benchmark; its libtest bench harness, which cargo bench runs first, would refuse criterion's flags such as --noplot.
[lib]
bench = false

[[bin]]
name = "simulator-reader"
path = "src/main.rs"
bench = false
