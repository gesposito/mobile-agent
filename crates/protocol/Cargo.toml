[package]
name = "protocol"
description = "The wire protocol between the mobile-agent daemon and every device agent: the message schema, the framing and the handshake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

# The library holds no benchmark; its libtest bench harness, which cargo bench runs first, would refuse criterion's flags such as --noplot.
[lib]
bench = false

[dependencies]
minicbor = { version = "2.3.0", features = ["std", "derive"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

# The microbenchmarks of the codec and the framing (benches/codec.rs), run by mobile-agent-bench micro; criterion's own harness is off.
[[bench]]
name = "codec"
harness = false
