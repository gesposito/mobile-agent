[workspace]
# The Simulator driver's in-guest reader lives inside its crate (design D11),
# one level below the glob.
members = ["crates/*", "crates/simulator/reader", "agent-ios"]
resolver = "3"

# Each package is named for crates.io, `mobile-agent` for the CLI and
# `mobile-agent-<name>` for the rest, while its library keeps the short name
# the code imports (`daemon`, `mirror`, `protocol`, ...) and its binaries keep
# theirs.
[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/gesposito/mobile-agent"
# crates.io alone, the registry about.toml names, so that cargo-about leaves
# the workspace's own crates out of the third-party notices.
publish = ["crates-io"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
# The Simulator driver downscales, hashes and encodes every frame on the CPU.
# Unoptimized, a 460x1000 frame took about 230 ms instead of 3, so debug
# builds, `cargo test` included, would stream at 4 fps using a whole core. The
# fallback encoder also drops the overflow checks release builds drop.
[profile.dev.package.mobile-agent-simulator]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3
overflow-checks = false

# Release code with the debug information a sampling profiler needs to name
# inlined frames and lines (spike S15, docs/spikes/s15-profiles.md): release
# builds strip the debug information by default. `cargo build --profile
# profiling` writes target/profiling/.
[profile.profiling]
inherits = "release"
debug = 1
strip = false
