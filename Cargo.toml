[workspace]
# The Simulator driver's in-guest reader lives inside its crate (design D11),
# one level below the glob.
members = ["crates/*", "crates/simulator/reader", "agent-ios"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
# Nothing is published yet; a first release adds `repository` beside it
# (docs/research/open-sourcing.md, What a first release will need).
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
# The Simulator driver downscales, hashes and encodes every frame on the CPU.
# Unoptimized, a 460x1000 frame took about 230 ms instead of 3, so debug
# builds, `cargo test` included, would stream at 4 fps using a whole core. The
# fallback encoder also drops the overflow checks release builds drop.
[profile.dev.package.simulator]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3
overflow-checks = false

# Release code with the debug information a sampling profiler needs to name
# inlined frames and lines (spike S15, docs/spikes/s15-profiles.md): release
# builds strip the debug information by default. `cargo build --profile
# profiling` writes target/profiling/.
[profile.profiling]
inherits = "release"
debug = 1
strip = false
