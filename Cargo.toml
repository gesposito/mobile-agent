[workspace]
members = ["crates/*"]
# Spikes are throwaway programs with their own manifests; see spikes/README.md.
# Exclude entries are path prefixes, not globs, so "spikes" covers every spike.
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
# The Simulator driver downscales, hashes and encodes every frame on the CPU.
# Unoptimized, a 460x1000 frame took about 230 ms instead of 3, so debug
# builds, `cargo test` included, would stream at 4 fps using a whole core. The
# fallback encoder also drops the overflow checks release builds drop.
[profile.dev.package.simulator]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3
overflow-checks = false
