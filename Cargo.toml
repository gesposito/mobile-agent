[workspace]
members = ["crates/*"]
# Spikes are throwaway programs with their own manifests; see spikes/README.md.
# Exclude entries are path prefixes, not globs, so "spikes" covers every spike.
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Negative priority lets individual clippy lints listed here override the group.
all = { level = "warn", priority = -1 }
