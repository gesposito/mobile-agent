# cargo-deny's checks of the dependency graph: `just deny` and CI's audit job
# run `cargo deny check advisories licenses bans sources` with this file, for
# the workspace and for the Android agent's host tests, a workspace of their
# own (docs/research/open-sourcing.md, Dependencies).

[graph]
# The platforms the crates build for: the macOS and Linux hosts, and the
# Simulator reader's and the iPhone runner's iOS targets.
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-ios-sim",
  "aarch64-apple-ios",
]
# Every optional feature, the frame encoders' included.
all-features = true

[advisories]
# A RustSec advisory, a vulnerability, an unmaintained crate or unsound code,
# fails the check, as does a yanked version; an exception goes into `ignore`
# with its reason.
yanked = "deny"
ignore = []

[licenses]
# Each license some dependency needs, allowed on purpose. Most crates are
# MIT OR Apache-2.0, and a license that only an alternative to MIT names
# (0BSD, BSD-2-Clause, CC0-1.0, MIT-0, Unlicense, LGPL-2.1-or-later) is not
# needed, so not allowed.
allow = [
  # ring, aws-lc and criterion's ciborium
  "Apache-2.0",
  # subtle and aws-lc-sys
  "BSD-3-Clause",
  # xxhash-rust, the mirror's hashes
  "BSL-1.0",
  # minicbor, the device protocol's codec
  "BlueOak-1.0.0",
  # webpki-roots' certificate data, for idevice's TLS
  "CDLA-Permissive-2.0",
  # jpeg-encoder, beside MIT OR Apache-2.0
  "IJG",
  # ring, rustls-webpki, untrusted and aws-lc
  "ISC",
  "MIT",
  # unicode-ident's tables, beside MIT OR Apache-2.0
  "Unicode-3.0",
  # foldhash and zlib-rs
  "Zlib",
]
confidence-threshold = 0.8

# The workspace's own crates are not published.
[licenses.private]
ignore = true

[bans]
# Two versions of a crate come through the dependencies' own requirements
# (thiserror, syn, rand and the rest; `cargo tree -d` lists them) and are not
# refused.
multiple-versions = "allow"
# A dependency without a version is refused, the workspace's paths aside.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io alone.
unknown-registry = "deny"
unknown-git = "deny"
